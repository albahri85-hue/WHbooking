<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة حجوزات الاستراحة</title>

<style>
:root {
  --purple: #6841a5;
  --purple-dark: #4d2b80;
  --purple-light: #f2ecfa;
  --bg: #f6f5fa;
  --text: #29253a;
  --muted: #777386;
  --border: #e8e4ef;
  --green: #20865b;
  --red: #c33c4a;
  --orange: #b97716;
  
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
  font-size: 13px;


}

button, input, select, textarea {
  font: inherit;
}

button { cursor: pointer; }

.topbar {
  background: linear-gradient(120deg, var(--purple-dark), var(--purple));
  color: white;
  padding: 13px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.topbar h1 {
  font-size: 19px;
  margin: 0;
}

.topbar small {
  display: block;
  opacity: .85;
  margin-top: 5px;
}

.container {
  max-width: 1450px;
  margin: auto;
  padding: 14px;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.toolbar-group {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.btn {
  border: 1px solid var(--border);
  background: white;
  color: var(--text);
  padding: 8px 12px;
  border-radius: 7px;
  font-size: 12px;
}

.btn-primary {
  background: var(--purple);
  color: white;
  border-color: var(--purple);
}

.btn-primary:hover { background: var(--purple-dark); }

.btn-danger {
  color: var(--red);
  border-color: #f0c9ce;
}

.btn-small {
  padding: 4px 7px;
  font-size: 11px;
}

.btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
  margin-bottom: 13px;
}

.stat {
  background: white;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px 13px;
}

.stat-label {
  color: var(--muted);
  font-size: 11px;
}

.stat-value {
  font-size: 22px;
  font-weight: bold;
  margin-top: 6px;
  color: var(--purple-dark);
}

.panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 13px;
  min-width: 0;
}

.panel-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}

.panel-heading h2 {
  font-size: 14px;
  margin: 0;
}

.tabs {
  display: flex;
  gap: 5px;
}

.tab {
  background: #f4f1f8;
  border: 0;
  border-radius: 6px;
  padding: 7px 11px;
  color: var(--text);
  font-size: 12px;
}

.tab.active {
  background: var(--purple);
  color: white;
}

/* بطاقات الغرف */
.rooms-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 9px;
}

.room-card {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px;
  background: #fff;
}

.room-card h3 {
  font-size: 13px;
  margin: 0 0 7px;
}

.room-card p {
  color: var(--muted);
  margin: 5px 0;
  font-size: 11px;
}

.status {
  display: inline-block;
  border-radius: 20px;
  padding: 3px 7px;
  font-size: 10px;
  white-space: nowrap;
}

.status-free {
  background: #e5f6ec;
  color: #187547;
}

.status-busy {
  background: #fff0dc;
  color: #995c08;
}

.status-other {
  background: #f0edf5;
  color: #6d6479;
}

/* التقويم: أحجام صغيرة */
.calendar-scroll {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 7px;
}

.calendar {
  display: grid;
  grid-template-columns: 100px repeat(7, minmax(75px, 1fr));
  min-width: 650px;
  gap: 0;
  font-size: 10px;
}

.cal-head {
  background: #f1edf7;
  color: #514266;
  padding: 7px 3px;
  text-align: center;
  font-weight: bold;
  border-left: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  line-height: 1.5;
}

.cal-room {
  padding: 7px 5px;
  font-size: 10px;
  font-weight: bold;
  background: #faf9fc;
  border-left: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  overflow-wrap: anywhere;
}

.cal-cell {
  padding: 3px;
  min-height: 43px;
  border-left: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: white;
  overflow: hidden;
}

.cal-booking {
  display: block;
  width: 100%;
  text-align: right;
  border: 0;
  border-right: 3px solid var(--purple);
  border-radius: 3px;
  background: var(--purple-light);
  color: #49306e;
  padding: 4px 4px;
  margin-bottom: 3px;
  font-size: 9px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.cal-booking:hover { background: #e7dafa; }

.cal-empty {
  color: #d0cbd8;
  text-align: center;
  padding-top: 10px;
}

/* جدول الحجوزات */
.table-scroll {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
}

th, td {
  padding: 8px 9px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
}

th {
  background: #f7f4fb;
  color: #5b4b71;
  font-weight: bold;
}

tbody tr:hover { background: #fbf9fe; }

.actions {
  display: flex;
  gap: 5px;
}

/* النوافذ */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(24, 17, 38, .55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 12px;
  z-index: 1000;
}

.modal.open { display: flex; }

.modal-content {
  width: min(510px, 100%);
  max-height: 92vh;
  overflow-y: auto;
  background: white;
  border-radius: 12px;
  padding: 17px;
  box-shadow: 0 15px 50px #0002;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 13px;
}

.modal-header h2 {
  font-size: 16px;
  margin: 0;
}

.close-btn {
  border: 0;
  background: #f0edf5;
  border-radius: 6px;
  padding: 5px 9px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}

.field { min-width: 0; }
.field.full { grid-column: 1 / -1; }

.field label {
  display: block;
  font-size: 11px;
  margin-bottom: 5px;
  color: #625b70;
}

.field input, .field select, .field textarea {
  width: 100%;
  border: 1px solid #ded8e8;
  border-radius: 6px;
  padding: 9px;
  background: white;
  outline: none;
  font-size: 12px;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--purple);
}

.field textarea {
  min-height: 60px;
  resize: vertical;
}

.shift-options {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
}

.shift-option {
  border: 1px solid #ded8e8;
  background: white;
  border-radius: 6px;
  padding: 8px 3px;
  font-size: 11px;
}

.shift-option.active {
  background: var(--purple-light);
  border-color: var(--purple);
  color: var(--purple-dark);
  font-weight: bold;
}

.price-box {
  padding: 10px;
  background: var(--purple-light);
  border-radius: 7px;
  color: var(--purple-dark);
  font-weight: bold;
  text-align: center;
}

.form-actions {
  display: flex;
  gap: 7px;
  margin-top: 14px;
}

.form-actions button { flex: 1; }

.message {
  display: none;
  padding: 10px;
  border-radius: 7px;
  margin-bottom: 10px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.message.show { display: block; }
.message.error { background: #fff0f0; color: #a12532; }
.message.success { background: #e9f8ef; color: #176a42; }

.muted { color: var(--muted); }
.hidden { display: none !important; }

.loading {
  text-align: center;
  padding: 18px;
  color: var(--muted);
}

@media (max-width: 650px) {
  .container { padding: 9px; }
  .topbar { padding: 12px; }
  .topbar h1 { font-size: 16px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat { padding: 9px; }
  .stat-value { font-size: 19px; }
  .form-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
  .calendar { grid-template-columns: 85px repeat(7, minmax(68px, 1fr)); }
}/* قائمة اختيار الوقت المخصصة */
.time-picker {
  position: relative;
  width: 100%;
}

.time-picker-button {
  width: 100%;
  padding: 7px 9px;
  min-height: 34px;
  border: 1px solid #ded8e8;
  border-radius: 6px;
  background: white;
  color: var(--text);
  text-align: right;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.time-picker-button:hover {
  border-color: var(--purple);
}

.time-picker-options {
  display: none;
  position: absolute;
  top: calc(100% + 3px);
  right: 0;
  width: 155px;
  max-height: 190px;
  overflow-y: auto;
  background: white;
  border: 1px solid var(--border);
  border-radius: 7px;
  box-shadow: 0 5px 15px #0002;
  z-index: 1100;
  padding: 4px;
}

.time-picker-options.open {
  display: block;
}

.time-option {
  display: block;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  border-radius: 4px;
  background: white;
  color: var(--text);
  text-align: right;
  font-family: Tahoma, Arial, sans-serif;
  font-size: 11px;
  cursor: pointer;
}

.time-option:hover {
  background: var(--purple-light);
}

.time-option.selected {
  background: var(--purple);
  color: white;
}

.time-picker + small {
  display: block;
  margin-top: 4px;
}

</style>
</head>

<body>

<header class="topbar">
  <div>
    <h1> إدارة النظام</h1>
   <small>إدراة ملفات </small>

  </div>
  <div class="toolbar-group">
    <button class="btn" type="button" onclick="window.location.href='booking.html'">صفحة الحجوزات</button>
    <!-- <button class="btn" id="refreshBtn">   </button> -->
     <button class="btn btn-primary" type="button" onclick="window.location.href='index.html'">خروج </button>
    <!-- <button class="btn btn-primary" id="newBookingBtn">＋ حجز جديد</button> -->
  </div>
</header>

<main class="container">


  <section class="panel">
    <div class="panel-heading">
      <h2>إدارة </h2>
    
      <div class="tabs">
        <button class="tab active" id="listTab">الغرف </button>
        <button class="tab" id="usersTab">المستخدمين</button>
      </div>
    </div>


    <!-- Show all Rooms -->

<div id="roomsSection" class="table-scroll">
  <button class="tab active" id="addButton" type="button">إضافة غرفة</button>
  <table>
    <thead>
      <tr>
        <th>اسم الغرفة</th>
        <th>الحالة</th>
        <th>سعر المبيت</th>
        <th>يوم كامل</th>
        <th>نصف يوم1</th>
        <th>نصف يوم2</th>
      </tr>
    </thead>
    <tbody id="roomsBody">
      <tr><td colspan="6">جاري تحميل الغرف...</td></tr>
    </tbody>
  </table>
</div>
<!-- Add a new room -->


<!-- نافذة إضافة غرفة -->
<div class="modal" id="roomModal">
  <div class="modal-content">

    <div class="modal-header">
      <h2>إضافة غرفة جديدة</h2>
      <button class="close-btn" type="button" id="closeRoomModalBtn">✕</button>
    </div>

    <div id="formMessage" class="message"></div>

    <form id="roomForm">
      <div class="form-grid">

        <div class="field">
          <label for="roomName">اسم الغرفة *</label>
          <input id="roomName" type="text" required maxlength="150">
        </div>

        <div class="field">
          <label for="roomStatus">الحالة</label>
          <select id="roomStatus">
            <option value="Open">Open</option>
            <option value="Close">Close </option>
          </select>
        </div>

        <div class="field">
          <label for="roomSleepOver">سعر المبيت (ر.ع)</label>
          <input id="roomSleepOver" type="number" min="0" step="0.01">
        </div>

        <div class="field">
          <label for="roomFull">سعر اليوم الكامل (ر.ع)</label>
          <input id="roomFull" type="number" min="0" step="0.01">
        </div>

        <div class="field">
          <label for="roomH1">سعر نصف اليوم الأول (ر.ع)</label>
          <input id="roomH1" type="number" min="0" step="0.01">
        </div>

        <div class="field">
          <label for="roomH2">سعر نصف اليوم الثاني (ر.ع)</label>
          <input id="roomH2" type="number" min="0" step="0.01">
        </div>

      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="saveRoomBtn">
          حفظ الغرفة
        </button>
        <button type="button" class="btn" id="cancelRoomBtn">
          إلغاء
        </button>
      </div>
    </form>

  </div>
</div>


<!--  -->

</main>


<script>
  const API_URL =
    "https://script.google.com/macros/s/AKfycbyhY5DrU7M9OqPUleO7BlOG2n_8UagOu0-UGzjTGPqKsjEXY63az8GHduGjfQc0NpmmKQ/exec";

const token = sessionStorage.getItem("token");
const isAdmin = ["admin", "sup_admin"].includes(
  (sessionStorage.getItem("role") || "").toLowerCase()
);

const roomForm = document.getElementById("roomForm");
const formMessage = document.getElementById("formMessage");

if (!token) {
  location.replace("index.html");
} else {
  const addButton = document.getElementById("addButton");
const roomModal = document.getElementById("roomModal");
const closeRoomModalBtn = document.getElementById("closeRoomModalBtn");
const cancelRoomBtn = document.getElementById("cancelRoomBtn");

// Show the Add Room button only for administrators
addButton.hidden = !isAdmin;

// Open the popup
addButton.addEventListener("click", () => {
  roomForm.reset();
  formMessage.className = "message";
  formMessage.textContent = "";

  roomModal.classList.add("open");
});
  loadRooms();
}

// Load rooms
function loadRooms() {
  fetch(`${API_URL}?action=read&sheet=rooms&token=${encodeURIComponent(token)}`)
    .then(r => r.json())
    .then(data => {
      if (!data.success) throw Error(data.message);

      document.getElementById("roomsBody").innerHTML =
        data.rows.map(room => `
          <tr>
            <td>${room.name ?? ""}</td>
            <td>${room.status ?? ""}</td>
            <td>${room.sleep_over ?? ""}</td>
            <td>${room.price_full ?? ""}</td>
            <td>${room.price_h1 ?? ""}</td>
            <td>${room.price_h2 ?? ""}</td>
          </tr>
        `).join("") ||
        '<tr><td colspan="6">لا توجد غرف</td></tr>';
    })
    .catch(error => {
      console.error(error);
      document.getElementById("roomsBody").innerHTML =
        `<tr><td colspan="6">تعذر تحميل الغرف: ${error.message}</td></tr>`;
    });
}

// Close popup
function closeRoomModal() {
  roomModal.classList.remove("open");
}

closeRoomModalBtn.addEventListener("click", closeRoomModal);
cancelRoomBtn.addEventListener("click", closeRoomModal);

// Close when clicking outside the popup
roomModal.addEventListener("click", event => {
  if (event.target === roomModal) {
    closeRoomModal();
  }
});

// Close with Escape
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeRoomModal();
  }
});

// Save room
roomForm.onsubmit = event => {
  event.preventDefault();

  if (!isAdmin) return alert("ليس لديك صلاحية لإضافة غرفة");

  const record = {
    name: document.getElementById("roomName").value.trim(),
    status: document.getElementById("roomStatus").value.trim(),
    sleep_over: document.getElementById("roomSleepOver").value,
    price_full: document.getElementById("roomFull").value,
    price_h1: document.getElementById("roomH1").value,
    price_h2: document.getElementById("roomH2").value
  };

formMessage.textContent = "جارٍ الحفظ...";
formMessage.className = "message show";

  fetch(API_URL, {
    method: "POST",
    body: new URLSearchParams({
      action: "add",
      sheet: "rooms",
      token,
      record: JSON.stringify(record)
    })
  })
  .then(r => r.json())
  .then(data => {
    if (!data.success) throw Error(data.message);

    closeRoomModal();
    loadRooms();
    alert("تمت إضافة الغرفة بنجاح");
  })
  .catch(error => {
    formMessage.textContent = "تعذر الحفظ: " + error.message;
formMessage.className = "message show error";
  });
};
</script>
</body>
</html>
